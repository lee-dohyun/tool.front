# tool.posselect.com 정적 서빙 설정.
#
# 이 사이트는 Traefik → Spring Cloud Gateway → 이 nginx 순서로 들어온다. 즉 TLS 종료와
# 라우팅은 앞단이 하고, 여기서는 파일만 내보낸다. Host 헤더에 의존하는 설정을 넣지 말 것
# (게이트웨이가 프록시하면서 Host 가 바뀔 수 있다).

# log_format 은 http 컨텍스트에서만 허용된다(server 블록 안에 두면 nginx 가 기동 자체를
# 거부한다). default.conf 는 메인 nginx.conf 의 http{} 안에 include 되므로, server{} 밖인
# 이 위치는 여전히 http 컨텍스트다.
log_format tool '$remote_addr ($http_x_forwarded_for) "$request" $status $body_bytes_sent';

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 프록시 3단을 거치므로 실제 클라이언트 IP 는 헤더에만 있다. 로그에 같이 남긴다.
    access_log /var/log/nginx/access.log tool;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
    gzip_min_length 1024;

    # 개발자 도구 인덱스라 검색 노출 대상이 아니다. 페이지의 meta robots 와 이중으로 건다.
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # vendor/qrcode.js 는 버전 고정 사본이라 오래 캐시해도 안전하다. 나머지 자산은
    # main push 마다 바뀔 수 있어 짧게 잡는다(이미지 태그가 SHA 라 파드는 교체되지만
    # 브라우저 캐시는 별개다).
    location = /assets/vendor/qrcode.js {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /assets/ {
        expires 10m;
        add_header Cache-Control "public";
    }

    # HTML 은 캐시하지 않는다 — 도구 카드가 추가돼도 안 보이는 일이 없도록.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }

    # 컨테이너 헬스체크용. K8s probe 가 매 10초 때리므로 로그를 남기지 않는다.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }
}
